---
layout: layout
---

<section class="home-section post-page">
  <header class="post-header">
    <a class="post-back" href="/blog/">&larr; Back to Blog</a>
    <div class="post-meta">
      <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%B %-d, %Y" }}
      </time>
      {% if page.theme %}
        <span class="blog-theme">{{ page.theme }}</span>
      {% endif %}
    </div>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.summary %}
      <p class="post-summary">{{ page.summary }}</p>
    {% endif %}
  </header>

  <article class="post-body">
    {{ content }}
  </article>
</section>
